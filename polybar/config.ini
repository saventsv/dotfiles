[bar/main]
width = 100%
height = 24pt
radius = 0
bottom = true
override-redirect = false
wm-restack = generic

background = #2d353b
foreground = #d3c6aa

font-0 = Iosevka Nerd Font:size=11;2

modules-right = wlan volume brightness powerprofile battery date
modules-left = xworkspaces

separator = |
separator-foreground = #475258

padding-left = 1
padding-right = 1
module-margin = 1

enable-ipc = true

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 2

format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = #a7c080

label-connected = %essid% %signal%%
label-connected-foreground = #d3c6aa

format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = #e67e80

label-disconnected = disconnected
label-disconnected-foreground = #e67e80


[module/volume]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = #a7c080

label-volume = %percentage%%
label-volume-foreground = #d3c6aa

format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = #e67e80

label-muted = muted
label-muted-foreground = #e67e80


[module/brightness]
type = custom/script
exec = brightnessctl -m | cut -d, -f4
interval = 2

format = <label>
format-prefix = "󰃠 "
format-prefix-foreground = #dbbc7f

label = %output%
label-foreground = #d3c6aa


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC

full-at = 100

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = #a7c080
label-charging = %percentage%%

format-discharging = <label-discharging>
format-discharging-prefix = " "
format-discharging-prefix-foreground = #a7c080
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = #a7c080
label-full = %percentage%%


[module/date]
type = internal/date
interval = 1

date = %I:%M %p

format = <label>
label = %date%
label-foreground = #d3c6aa

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = false

label-active = %name%
label-active-foreground = #3d484d
label-active-background = #a7c080
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = #d3c6aa
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = #e67e80
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = #859289
label-empty-padding = 1

[module/powerprofile]
type = custom/script
exec = powerprofilesctl get
interval = 2

format = <label>
format-prefix = "󱐋"
format-prefix-foreground = #dbbc7f

