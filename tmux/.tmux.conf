# Remove all default key bindings
unbind -a

# (optional but common) remove prefix-based default behavior
unbind C-b
set -g prefix None

# set colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",st-256color:Tc"
set -ga terminal-overrides ",*;RGB"
set -g mouse on
set -g set-clipboard on


# New prefix
set -g prefix C-Space
bind C-Space send-prefix

# Needed binds
# bind d detach-client
bind r source-file ~/.tmux.conf \; display "reloaded config"

# Panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Split Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# General Configuration
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
# bind -n M-s display-popup -E "s"

# bind -n C-t new-window
bind n new-window

# bind -n M-q kill-pane
bind c kill-pane

# Vi copy mode
set-window-option -g mode-keys vi
bind y copy-mode
bind -n C-s copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle 
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy --foreground"


unbind -T copy-mode-vi MouseDragEnd1Pane


# Status bar
set -g status on
set -g status-position bottom

set -g status-style bg=#1E2326,fg=#A7C080

# set -g status-left " #S "
set -g status-left ""
set -g status-right ""

setw -g window-status-format " #I "
setw -g window-status-current-format " [#I] "
